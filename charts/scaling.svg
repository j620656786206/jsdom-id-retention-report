  <text x="46" y="253.33333333333334" class="tick muted" text-anchor="end">200</text>
  <line x1="56" y1="174.66666666666669" x2="736" y2="174.66666666666669" class="grid" stroke-width="1"/>
  <text x="46" y="178.66666666666669" class="tick muted" text-anchor="end">400</text>
  <line x1="56" y1="100" x2="736" y2="100" class="grid" stroke-width="1"/>
  <text x="46" y="104" class="tick muted" text-anchor="end">600</text>
