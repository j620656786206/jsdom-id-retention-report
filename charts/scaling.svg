  <text x="127" y="296.6501333333333" class="val ink" text-anchor="middle">52</text>
  <text x="127" y="344" class="lbl ink2" text-anchor="middle">10 para</text>
  <path d="M225,324v-54.7888a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v54.7888z" class="accent"/>
  <text x="237" y="257.2112" class="val ink" text-anchor="middle">157</text>
  <text x="237" y="344" class="lbl ink2" text-anchor="middle">40 para</text>
  <path d="M335,324v-212.41386666666665a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v212.41386666666665z" class="accent"/>
  <text x="347" y="99.58613333333335" class="val ink" text-anchor="middle">580</text>
  <text x="347" y="344" class="lbl ink2" text-anchor="middle">160 para</text>
