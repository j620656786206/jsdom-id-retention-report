<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
  <title id="t">id decides whether; size decides how much</title>
  <desc id="d">Both panels share one y-axis (jsdom 30.0.1). Vary document size, hold id count at 1: 51.83, 157.47, 579.68. Vary id count, hold size at 40 paragraphs: 156.94, 231.31</desc>
  <style>
    .s { fill: #fcfcfb }
    .ink { fill: #0b0b0b }  .ink2 { fill: #52514e }
    .muted { fill: #898781 }
    .grid { stroke: #e1e0d9 }  .axis { stroke: #c3c2b7 }
    .accent { fill: #2a78d6 }  .context { fill: #898781 }
    .gap { stroke: #fcfcfb }
    text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; }
    .t   { font-size: 15px; font-weight: 600 }
    .st  { font-size: 12.5px }
    .lbl { font-size: 12px }
    .val { font-size: 12px; font-weight: 600 }
    .tick { font-size: 11px; font-variant-numeric: tabular-nums }
    @media (prefers-color-scheme: dark) {
      .s { fill: #1a1a19 }
      .ink { fill: #ffffff }  .ink2 { fill: #c3c2b7 }
      .muted { fill: #898781 }
      .grid { stroke: #2c2c2a }  .axis { stroke: #383835 }
      .accent { fill: #3987e5 }  .context { fill: #898781 }
      .gap { stroke: #1a1a19 }
    }
  </style>
  <rect width="760" height="380" rx="8" class="s"/>
  <text x="24" y="30" class="t ink">id decides whether; size decides how much</text>
  <text x="24" y="50" class="st ink2">Both panels share one y-axis (jsdom 30.0.1)</text>
  <text x="736" y="30" class="tick muted" text-anchor="end">KB/call</text>
  <line x1="56" y1="324" x2="736" y2="324" class="grid" stroke-width="1"/>
  <text x="46" y="328" class="tick muted" text-anchor="end">0</text>
