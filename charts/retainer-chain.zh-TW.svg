<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">為什麼收不回來</title>
  <desc id="d">為什麼收不回來: GC roots → Window → Map → Set → HTMLDivElementImpl</desc>
  <style>
    .s { fill: #ffffff }
    .ink { fill: #18181b }  .ink2 { fill: #52525b }
    .muted { fill: #71717a }
    .grid { stroke: #e7e5e0 }  .axis { stroke: #d6d3cd }
    .accent { fill: #be185d }  .context { fill: #a1a1aa }
    .gap { stroke: #ffffff }
    text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .t   { font-size: 15px; font-weight: 600 }
    .st  { font-size: 12.5px }
    .lbl { font-size: 12px }
    .val { font-size: 12px; font-weight: 600 }
    .tick { font-size: 11px; font-variant-numeric: tabular-nums }
    @media (prefers-color-scheme: dark) {
      .s { fill: #1c1c1f }
      .ink { fill: #ededef }  .ink2 { fill: #a1a1aa }
      .muted { fill: #8b8b93 }
      .grid { stroke: #2e2e33 }  .axis { stroke: #3f3f46 }
      .accent { fill: #ec4899 }  .context { fill: #71717a }
      .gap { stroke: #1c1c1f }
    }
  </style>
  <rect width="760" height="330" rx="8" class="s"/>
  <text x="24" y="30" class="t ink">為什麼收不回來</text>
  <text x="24" y="50" class="st ink2">從 heap snapshot 反向走訪到 GC root</text>
  <rect x="40" y="84" width="200" height="34" rx="6" class="context" opacity="0.28"/>
  <text x="52" y="106" class="lbl ink" font-weight="600">GC roots</text>
  <line x1="56" y1="118" x2="56" y2="136" class="axis" stroke-width="2"/>
  <rect x="66" y="136" width="200" height="34" rx="6" class="accent" opacity="1"/>
  <text x="78" y="158" class="lbl s" font-weight="600">Window</text>
  <text x="280" y="158" class="lbl ink2">常駐，行程活著就不會釋放</text>
  <line x1="82" y1="170" x2="82" y2="188" class="axis" stroke-width="2"/>
  <text x="92" y="186" class="tick muted">WeakMap[key = Window]</text>
  <rect x="92" y="188" width="200" height="34" rx="6" class="context" opacity="0.28"/>
  <text x="104" y="210" class="lbl ink" font-weight="600">Map</text>
  <text x="306" y="210" class="lbl ink2">key 是 id 字串</text>
  <line x1="108" y1="222" x2="108" y2="240" class="axis" stroke-width="2"/>
  <rect x="118" y="240" width="200" height="34" rx="6" class="context" opacity="0.28"/>
  <text x="130" y="262" class="lbl ink" font-weight="600">Set</text>
  <text x="332" y="262" class="lbl ink2">每解析一次就多一個，沒有移除路徑</text>
  <line x1="134" y1="274" x2="134" y2="292" class="axis" stroke-width="2"/>
  <rect x="144" y="292" width="200" height="34" rx="6" class="accent" opacity="1"/>
  <text x="156" y="314" class="lbl s" font-weight="600">HTMLDivElementImpl</text>
  <text x="358" y="314" class="lbl ink2">→ 留住整份文件</text>

</svg>
